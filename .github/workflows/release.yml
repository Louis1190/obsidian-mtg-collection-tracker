name: Release

# Publishes a release when a version tag is pushed. The tag must equal the "version" of
# manifest.json (this is what Obsidian's plugin directory checks). This file is copied as is
# into the public repository by tools/publish-public.mjs; it is not used by the private
# repository (whose workflow is .github/workflows/release.yml).

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write # sign the attestation (short-lived OIDC token)
  attestations: write # publish the attestation on GitHub

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check that the tag is the manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      # Signed provenance of the three release files (Obsidian's plugin directory recommends it): anyone can check
      # with `gh attestation verify <file> --repo <owner>/<repository>` that it was built by THIS workflow,
      # from THIS repository. To be done BEFORE uploading: the attested files are the ones that get uploaded.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release notes are the body of the publication commit (tools/publish-public.mjs --notes, mandatory);
          # the fallback is only used if someone pushed a tag without going through the script.
          git log -1 --format=%b "$GITHUB_SHA" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then echo "Release $GITHUB_REF_NAME" > release-notes.md; fi
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

      # GitHub's release list sometimes shows a new release without its files for a while;
      # the directory (and BRAT) read that list, so fail loudly instead of leaving a broken release.
      - name: Verify release assets are registered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OK=""
          for ATTEMPT in $(seq 1 12); do
            ASSETS=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].assets | map(.name) | sort | join(",")')
            if [ "$ASSETS" = "main.js,manifest.json,styles.css" ]; then
              OK=1
              break
            fi
            echo "Attempt $ATTEMPT: the newest release lists [$ASSETS], expected all 3 files, retrying in 5s..."
            sleep 5
          done
          if [ -z "$OK" ]; then
            echo "::error::The newest release still does not list main.js, manifest.json and styles.css after 60s"
            exit 1
          fi
          echo "OK: main.js, manifest.json and styles.css are registered"
